<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
    <title>夏日永不下坠</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet" />

    <style>
        /* ========== 启动页样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            transition: opacity 1.2s ease, transform 1.2s ease;
            opacity: 1;
            transform: scale(1);
            font-family: "Helvetica Neue", Arial, sans-serif;
        }
        #splash-screen.hide {
            opacity: 0;
            transform: scale(1.02);
            filter: blur(10px);
            pointer-events: none;
        }
        #splash-screen.hidden {
            display: none;
        }

        .bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                #bfe6ff 0%,
                #eaf6ff 40%,
                #dff3ff 60%,
                #b9e2ff 100%
            );
        }

        .sea {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(
                to top,
                #3aa6d6 0%,
                #5cc0e6 40%,
                transparent 100%
            );
            filter: blur(0.2px);
        }

        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .title {
            font-size: 96px;
            letter-spacing: 18px;
            font-weight: 300;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.6s ease forwards;
            animation-delay: 0.6s;
            color: #FFD84D;
            text-shadow: 0 15px 45px rgba(255, 216, 77, 0.35);
        }

        .author-splash {
            margin-top: 18px;
            font-size: 14px;
            letter-spacing: 6px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 1.6s ease forwards;
            animation-delay: 1.4s;
            color: #FFD84D;
        }

        .bar {
            margin-top: 40px;
            width: 160px;
            height: 1px;
            background: rgba(255, 216, 77, 0.25);
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 0.3s;
        }
        .bar::after {
            content: "";
            position: absolute;
            width: 40%;
            height: 100%;
            background: rgba(255, 216, 77, 0.95);
            animation: loading 1.2s infinite ease-in-out;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes loading {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* ========== 正文容器 ========== */
        #main {
            position: fixed;
            inset: 0;
            background-image: url('https://s41.ax1x.com/2026/07/03/pm0eFaT.png');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            overflow: hidden;
            font-family: 'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC', '苹方-简', 'Microsoft YaHei', sans-serif;
            font-weight: 100;
            color: #000;
        }
        #main.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ========== 正文翻页样式 ========== */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: clamp(16px, 4vw, 40px);
            color: #000;
            text-shadow: none;
            text-align: center;
            overflow-y: auto;
            backface-visibility: hidden;
            opacity: 0;
            transform: perspective(800px) rotateY(0deg) scale(0.98);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.6s ease;
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            transform: perspective(800px) rotateY(0deg) scale(1);
            pointer-events: auto;
        }

        .page.flip-out {
            opacity: 0;
            transform: perspective(800px) rotateY(-40deg) scale(0.9) translateX(60px);
            transition: transform 0.5s cubic-bezier(0.55, 0.085, 0.68, 0.53), opacity 0.5s ease;
        }

        .page.flip-in {
            opacity: 1;
            transform: perspective(800px) rotateY(0deg) scale(1) translateX(0);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0.1s, opacity 0.6s ease 0.1s;
        }

        .page-cover .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 1;
            transition: opacity 1.5s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .page-cover .hint.fade {
            opacity: 0;
        }

        .page-blur {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .content {
            width: 33.33%;
            max-width: 600px;
            min-width: 280px;
            margin: 0 auto;
            padding: 10px 0;
        }

        @media (max-width: 768px) {
            .content {
                width: 90%;
                max-width: 100%;
                min-width: unset;
            }
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 100;
            letter-spacing: 0.1em;
            margin-bottom: 0.3em;
            color: #000;
        }

        h2 {
            font-size: clamp(1.6rem, 4vw, 3rem);
            font-weight: 100;
            letter-spacing: 0.05em;
            margin-bottom: 0.5em;
            color: #000;
        }

        p {
            font-size: clamp(0.95rem, 2.2vw, 1.3rem);
            line-height: 1.6;
            margin: 0.6em 0;
            text-align: left;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
            color: #000;
        }

        .chapter-text p {
            text-indent: 2em;
        }

        .title-page .content {
            text-align: center;
        }
        .title-page h1,
        .title-page .sub,
        .title-page p,
        .title-page .author {
            text-align: center;
        }

        .sub {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #000;
            opacity: 1;
            letter-spacing: 0.05em;
        }

        .author {
            margin-top: 1.5em;
            font-size: clamp(0.8rem, 1.8vw, 1.1rem);
            opacity: 0.8;
            letter-spacing: 0.1em;
        }

        .chapter-text {
            text-align: left;
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 5px;
            width: 100%;
        }

        .chapter-text p {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            line-height: 1.6;
            margin-bottom: 0.8em;
            text-indent: 2em;
            color: #000;
        }

        .chapter-text p:last-child {
            margin-bottom: 0;
        }

        .chapter-text::-webkit-scrollbar {
            width: 4px;
        }
        .chapter-text::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 2px;
        }

        @media (min-width: 1200px) {
            .content {
                max-width: 500px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 启动屏幕 ===== -->
    <div id="splash-screen">
        <div class="bg"></div>
        <div class="sea"></div>
        <div class="loader">
            <div class="title">XYZ</div>
            <div class="author-splash">author</div>
            <div class="bar"></div>
        </div>
    </div>

    <!-- ===== 正文主容器 ===== -->
    <div id="main">
        <!-- 第1页：封面（索引0） -->
        <div class="page page-cover" data-index="0">
            <div class="hint" id="hint">← 上一页 · 点击左右翻页 →</div>
        </div>

        <!-- 第2页：书名页（索引1）— 默认显示 -->
        <div class="page page-blur title-page active" data-index="1">
            <div class="content">
                <h1>夏日永不下坠</h1>
                <p class="sub">［我变美的那个夏天］</p>
                <p>Summer &amp; Conrad</p>
                <p class="author">作者：XYZ</p>
            </div>
        </div>

        <!-- 第3~15页：章节内容（略，请自行补全） -->
        <div class="page page-blur" data-index="2">
            <div class="content">
                <h2>01</h2>
                <div class="chapter-text">
                    <p>再次拥有生命的时候，其实我也算不上多高兴。</p>
                    <p>我的人生有很多遗憾……</p>
                </div>
            </div>
        </div>
        <!-- 更多章节请自行添加 -->
    </div>

    <script>
        // ========== 启动页逻辑 ==========
        window.addEventListener("load", function () {
            // === 修改点：将 2200 改为 800（毫秒） ===
            setTimeout(function () {
                const splash = document.getElementById("splash-screen");
                splash.classList.add("hide");

                setTimeout(function () {
                    splash.classList.add("hidden");
                    const main = document.getElementById("main");
                    main.classList.add("show");
                    showPage(1); // 默认显示书名页
                }, 1200);
            }, 800); // <--- 这里从 2200 改为 800
        });

        // ========== 正文翻页逻辑 ==========
        setTimeout(() => {
            const hint = document.getElementById('hint');
            if (hint) hint.classList.add('fade');
        }, 4000);

        let currentIndex = 1;
        const pages = document.querySelectorAll('.page');
        const total = pages.length;

        function showPage(index) {
            pages.forEach((p, i) => {
                p.classList.remove('active', 'flip-out', 'flip-in');
            });
            pages[index].classList.add('active');
            currentIndex = index;
        }

        function goTo(delta) {
            const newIndex = currentIndex + delta;
            if (newIndex < 0 || newIndex >= total) return;

            const oldPage = pages[currentIndex];
            const newPage = pages[newIndex];

            oldPage.classList.add('flip-out');
            newPage.classList.add('flip-in');

            const onEnd = () => {
                oldPage.classList.remove('flip-out');
                newPage.classList.remove('flip-in');
                currentIndex = newIndex;
                pages.forEach((p, i) => {
                    p.classList.toggle('active', i === currentIndex);
                });
                oldPage.removeEventListener('transitionend', onEnd);
                newPage.removeEventListener('transitionend', onEnd);
            };

            oldPage.addEventListener('transitionend', onEnd);
            newPage.addEventListener('transitionend', onEnd);
        }

        document.addEventListener('click', function (e) {
            const x = e.clientX;
            const w = window.innerWidth;
            if (x < w / 2) { goTo(-1); } else { goTo(1); }
        });

        let touchStartX = 0, touchStartY = 0;
        let isSwiping = false;

        document.addEventListener('touchstart', function (e) {
            const touch = e.changedTouches[0];
            touchStartX = touch.screenX;
            touchStartY = touch.screenY;
            isSwiping = false;
        }, { passive: true });

        document.addEventListener('touchmove', function (e) {
            const touch = e.changedTouches[0];
            const dx = touch.screenX - touchStartX;
            const dy = touch.screenY - touchStartY;
            if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                isSwiping = true;
            }
        }, { passive: true });

        document.addEventListener('touchend', function (e) {
            if (isSwiping) return;
            const touch = e.changedTouches[0];
            const x = touch.screenX;
            const w = window.innerWidth;
            if (x < w / 2) { goTo(-1); } else { goTo(1); }
        }, { passive: true });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
                e.preventDefault();
                goTo(1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goTo(-1);
            }
        });
    </script>
</body>
</html>
