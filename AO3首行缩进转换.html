<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AO3 首行缩进转换器</title>
    <style>
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f5f0eb;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Source Han Sans SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.8;
        }
        .btn {
            background: #3aa6d6;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 12px 0;
        }
        .btn:hover {
            background: #2b8bb5;
        }
        .btn-copy {
            background: #6c7a89;
        }
        .btn-copy:hover {
            background: #55606b;
        }
        .output-area {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            min-height: 200px;
            margin-top: 12px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .hint {
            color: #666;
            font-size: 14px;
            margin: 8px 0;
            padding: 8px 12px;
            background: #fff8e7;
            border-radius: 4px;
            border-left: 4px solid #f7c948;
        }
    </style>
</head>
<body>

    <h1>📝 AO3 首行缩进转换器</h1>
    <p style="color: #666;">粘贴你的纯文本内容，点击转换，自动给每个段落开头加上全角空格。</p>

    <div class="hint">
        💡 每一行作为一个段落（即按回车换行的位置），会自动缩进。
    </div>

    <textarea id="inputText" placeholder="在此粘贴你的正文内容..."></textarea>

    <br>
    <button class="btn" onclick="convert()">✨ 一键转换</button>
    <button class="btn btn-copy" onclick="copyResult()">📋 复制结果</button>

    <h3>转换结果（直接复制粘贴到 AO3）</h3>
    <div class="output-area" id="outputText"></div>

    <script>
        function convert() {
            const input = document.getElementById('inputText').value;
            if (!input.trim()) {
                alert('请先粘贴你要转换的正文内容！');
                return;
            }

            // 按行分割，过滤掉空行（但保留有内容行）
            const lines = input.split('\n');
            const result = lines.map(line => {
                // 如果这行不是空行，前面加上两个全角空格
                if (line.trim() !== '') {
                    return '　　' + line.trimStart();
                }
                return ''; // 空行保留为空行
            }).join('\n');

            document.getElementById('outputText').textContent = result;
        }

        function copyResult() {
            const output = document.getElementById('outputText').textContent;
            if (!output.trim()) {
                alert('还没有转换结果，请先点击"一键转换"！');
                return;
            }

            // 使用 Clipboard API 复制
            navigator.clipboard.writeText(output).then(() => {
                alert('✅ 已复制到剪贴板！直接粘贴到 AO3 的 HTML 模式即可。');
            }).catch(() => {
                // 降级方案：选择文本并提示手动复制
                const range = document.createRange();
                range.selectNodeContents(document.getElementById('outputText'));
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                alert('请按 Ctrl+C（或 Cmd+C）复制选中的文本。');
            });
        }
    </script>

</body>
</html>
