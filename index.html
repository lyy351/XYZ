<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动卡片 + 加载过渡</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* ===== 加载过渡层（纯黑背景，不透明） ===== */
  #loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
    background: #000000;
    transition: opacity 0.8s ease;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  /* 过渡层内的顶部和底部按钮（与主页面样式相同） */
  .overlay-btn,
  .overlay-btn::after {
    display: block;
    width: 100%;
    height: 30px;
    padding: 0;
    font-size: 18px;
    background: linear-gradient(45deg, transparent 5%, #ff013c 5%);
    border: 0;
    color: #fff;
    letter-spacing: 4px;
    line-height: 30px;
    box-shadow: 6px 0px 0px #00e6f6;
    outline: transparent;
    position: absolute;
    left: 0;
    text-align: center;
    z-index: 10000;
    box-sizing: border-box;
    margin: 0;
    pointer-events: none;
  }
  .overlay-btn.top { top: 0; }
  .overlay-btn.bottom { bottom: 0; }

  .overlay-btn::after {
    content: "XYZXYZXYZXYZXYZXYZXYZXYZ";
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(45deg, transparent 3%, #00e6f6 3%, #00e6f6 5%, #ff013c 5%);
    text-shadow: -3px -3px 0px #f8f005, 3px 3px 0px #00e6f6;
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    animation: blink 6s ease-in-out infinite;
  }

  /* 中间全屏文字（无背景，故障动画） */
  #loading-btn,
  #loading-btn::after {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    font-size: 30vw;
    background: transparent !important;
    box-shadow: none !important;
    border: 0;
    color: rgba(200, 200, 200, 0.35);
    letter-spacing: 4px;
    line-height: 1.2;
    outline: transparent;
    position: relative;
    text-align: center;
    cursor: default;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;  /* 撑满中间区域 */
  }

  #loading-btn::after {
    --slice-0: inset(50% 50% 50% 50%);
    --slice-1: inset(80% -6px 0 0);
    --slice-2: inset(50% -6px 30% 0);
    --slice-3: inset(10% -6px 85% 0);
    --slice-4: inset(40% -6px 43% 0);
    --slice-5: inset(80% -6px 5% 0);
    content: "XYZ";
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: transparent !important;
    text-shadow: -6px -6px 0px rgba(248, 240, 5, 0.3), 6px 6px 0px rgba(0, 230, 246, 0.3);
    clip-path: var(--slice-0);
    pointer-events: none;
    font-size: inherit;
    letter-spacing: inherit;
    line-height: inherit;
    animation: glitch 0.8s steps(1, end) infinite;
  }

  @keyframes glitch {
    0%   { clip-path: var(--slice-1); transform: translate(-30px, -20px); }
    12.5% { clip-path: var(--slice-3); transform: translate(30px, 20px); }
    25%  { clip-path: var(--slice-2); transform: translate(-20px, 30px); }
    37.5% { clip-path: var(--slice-4); transform: translate(20px, -30px); }
    50%  { clip-path: var(--slice-5); transform: translate(-40px, 10px); }
    62.5% { clip-path: var(--slice-1); transform: translate(40px, -10px); }
    75%  { clip-path: var(--slice-3); transform: translate(-10px, -40px); }
    87.5% { clip-path: var(--slice-2); transform: translate(10px, 40px); }
    100% { clip-path: var(--slice-4); transform: translate(0, 0); }
  }

  @keyframes blink {
    0%   { opacity: 0; }
    83%  { opacity: 0; }
    83.3% { opacity: 1; }
    100% { opacity: 1; }
  }

  /* 加载完成后淡出隐藏 */
  #loading-overlay.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  /* ===== 以下为主页面样式（完全不变） ===== */
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
    font-family: Arial, sans-serif;
    padding: 40px 0;
    box-sizing: border-box;
  }

  /* 上下固定长条按钮（自动闪烁XYZ） */
  .xyz-btn,
  .xyz-btn::after {
    display: block;
    width: 100%;
    height: 30px;
    padding: 0;
    font-size: 18px;
    background: linear-gradient(45deg, transparent 5%, #ff013c 5%);
    border: 0;
    color: #fff;
    letter-spacing: 4px;
    line-height: 30px;
    box-shadow: 6px 0px 0px #00e6f6;
    outline: transparent;
    position: fixed;
    left: 0;
    text-align: center;
    z-index: 1000;
    box-sizing: border-box;
    margin: 0;
    pointer-events: none;
  }
  .xyz-btn.top { top: 0; }
  .xyz-btn.bottom { bottom: 0; }

  .xyz-btn::after {
    content: "XYZXYZXYZXYZXYZXYZXYZXYZ";
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(45deg, transparent 3%, #00e6f6 3%, #00e6f6 5%, #ff013c 5%);
    text-shadow: -3px -3px 0px #f8f005, 3px 3px 0px #00e6f6;
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    animation: blink 6s ease-in-out infinite;
  }

  /* 原创/同人 按钮组 */
  .container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .radio-wrapper {
    position: relative;
    height: 38px;
    width: 84px;
    margin: 3px;
  }
  .radio-wrapper .input {
    position: absolute;
    height: 100%;
    width: 100%;
    margin: 0;
    cursor: pointer;
    z-index: 10;
    opacity: 0;
  }
  .btn {
    --primary: #ff184c;
    --shadow-primary: #fded00;
    --color: white;
    --font-size: 9px;
    --shadow-primary-hue: 180;
    --shadow-secondary-hue: 60;
    --shadow-secondary: hsl(var(--shadow-secondary-hue), 90%, 60%);
    --clip: polygon(11% 0, 95% 0, 100% 25%, 90% 90%, 95% 90%, 85% 90%, 85% 100%, 7% 100%, 0 80%);
    --border: 5px;
    --shimmy-distance: 5;
    --clip-one: polygon(0 2%, 100% 2%, 100% 95%, 95% 95%, 95% 90%, 85% 90%, 85% 95%, 8% 95%, 0 70%);
    --clip-two: polygon(0 78%, 100% 78%, 100% 100%, 95% 100%, 95% 90%, 85% 90%, 85% 100%, 8% 100%, 0 78%);
    --clip-three: polygon(0 44%, 100% 44%, 100% 54%, 95% 54%, 95% 54%, 85% 54%, 85% 54%, 8% 54%, 0 54%);
    --clip-four: polygon(0 0, 100% 0, 100% 0, 95% 0, 95% 0, 85% 0, 85% 0, 8% 0, 0 0);
    --clip-five: polygon(0 0, 100% 0, 100% 0, 95% 0, 95% 0, 85% 0, 85% 0, 8% 0, 0 0);
    --clip-six: polygon(0 40%, 100% 40%, 100% 85%, 95% 85%, 95% 85%, 85% 85%, 85% 85%, 8% 85%, 0 70%);
    --clip-seven: polygon(0 63%, 100% 63%, 100% 80%, 95% 80%, 95% 80%, 85% 80%, 85% 80%, 8% 80%, 0 70%);
    color: var(--color);
    text-transform: uppercase;
    font-size: var(--font-size);
    letter-spacing: 3px;
    position: relative;
    font-weight: 900;
    width: 100%;
    height: 100%;
    line-height: 38px;
    text-align: center;
    transition: background 0.2s, 0.3s;
  }
  .input:checked + .btn {
    --primary: #8B00FF;
    --shadow-primary: #00e572;
  }
  .input:hover + .btn {
    --primary: #cc133c;
    --font-size: 11px;
  }
  .btn:after, .btn:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    clip-path: var(--clip);
    z-index: -1;
  }
  .btn:before {
    background: var(--shadow-primary);
    transform: translate(var(--border), 0);
  }
  .btn:after {
    background: var(--primary);
  }
  .number {
    background: var(--shadow-primary);
    color: #323232;
    font-size: 5.5px;
    font-weight: 700;
    letter-spacing: 1px;
    position: absolute;
    width: 15px;
    height: 6px;
    top: 0;
    left: 81%;
    line-height: 6.2px;
    text-align: center;
  }
  .btn__glitch {
    position: absolute;
    top: calc(var(--border) * -1);
    left: calc(var(--border) * -1);
    right: calc(var(--border) * -1);
    bottom: calc(var(--border) * -1);
    background: var(--shadow-primary);
    text-shadow: 2px 2px var(--shadow-primary), -2px -2px var(--shadow-secondary);
    clip-path: var(--clip);
    animation: glitch 2s infinite;
    display: none;
  }
  .input:hover + .btn .btn__glitch,
  .input:checked + .btn .btn__glitch {
    display: block;
  }
  .input:checked + .btn .btn__glitch {
    animation: glitch 5s infinite;
  }
  .btn__glitch:before {
    content: '';
    position: absolute;
    top: calc(var(--border) * 1);
    right: calc(var(--border) * 1);
    bottom: calc(var(--border) * 1);
    left: calc(var(--border) * 1);
    clip-path: var(--clip);
    background: var(--primary);
    z-index: -1;
  }
  /* 原有glitch关键帧（给原创/同人用的） */
  @keyframes glitch {
    0% { clip-path: var(--clip-one); }
    2%, 8% { clip-path: var(--clip-two); transform: translate(calc(var(--shimmy-distance) * -1%), 0); }
    6% { clip-path: var(--clip-two); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
    9% { clip-path: var(--clip-two); transform: translate(0, 0); }
    10% { clip-path: var(--clip-three); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
    13% { clip-path: var(--clip-three); transform: translate(0, 0); }
    14%, 21% { clip-path: var(--clip-four); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
    25% { clip-path: var(--clip-five); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
    30% { clip-path: var(--clip-five); transform: translate(calc(var(--shimmy-distance) * -1%), 0); }
    35%, 45% { clip-path: var(--clip-six); transform: translate(calc(var(--shimmy-distance) * -1%)); }
    40% { clip-path: var(--clip-six); transform: translate(calc(var(--shimmy-distance) * 1%)); }
    50% { clip-path: var(--clip-six); transform: translate(0, 0); }
    55% { clip-path: var(--clip-seven); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
    60% { clip-path: var(--clip-seven); transform: translate(0, 0); }
    31%, 61%, 100% { clip-path: var(--clip-four); }
  }

  /* 卡片 */
  .card {
    width: 210px;
    height: 254px;
    border-radius: 4px;
    background: #212121;
    display: flex;
    gap: 5px;
    padding: .4em;
  }
  .card p {
    height: 100%;
    flex: 1;
    overflow: hidden;
    cursor: pointer;
    border-radius: 2px;
    transition: all .5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    background: #212121;
    border: 1px solid #ff5a91;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    user-select: none;
    position: relative;
  }
  .card p:hover {
    flex: 4;
  }
  .card p span {
    min-width: 14em;
    padding: .5em;
    text-align: center;
    transform: rotate(-90deg);
    transition: all .5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    text-transform: uppercase;
    color: #ff568e;
    letter-spacing: .1em;
    font-size: 14px;
    font-weight: bold;
  }
  .card p:hover span {
    transform: rotate(0);
  }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #ff5a91;
    color: #1a1a1a;
    padding: 12px 28px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 999;
    box-shadow: 0 8px 30px rgba(255, 90, 145, 0.3);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <!-- ===== 加载过渡层（纯黑背景） ===== -->
  <div id="loading-overlay">
    <!-- 顶部按钮 -->
    <div class="overlay-btn top"></div>

    <!-- 中间全屏文字 -->
    <button id="loading-btn">XYZ</button>

    <!-- 底部按钮 -->
    <div class="overlay-btn bottom"></div>
  </div>

  <!-- ===== 主内容 ===== -->
  <button class="xyz-btn top"></button>

  <div class="container">
    <div class="radio-wrapper">
      <input class="input" name="mode" id="value-1" type="radio" checked>
      <div class="btn">
        <span aria-hidden="">_</span>原创
        <span class="btn__glitch" aria-hidden="">_原创🦾</span>
        <label class="number">原</label>
      </div>
    </div>
    <div class="radio-wrapper">
      <input class="input" name="mode" id="value-2" type="radio">
      <div class="btn">
        <span aria-hidden="">_</span>同人
        <span class="btn__glitch" aria-hidden="">_同人_</span>
        <label class="number">同</label>
      </div>
    </div>
  </div>

  <div class="card">
    <p data-label="选项一"><span>HOVER ME</span></p>
    <p data-label="选项二"><span>HOVER ME</span></p>
    <p data-label="选项三"><span>HOVER ME</span></p>
  </div>

  <button class="xyz-btn bottom"></button>

  <div class="toast" id="toast"></div>

  <script>
    // 加载过渡：2秒后淡出
    window.addEventListener('load', function() {
      const overlay = document.getElementById('loading-overlay');
      setTimeout(function() {
        overlay.classList.add('fade-out');
        setTimeout(function() {
          overlay.style.display = 'none';
        }, 800);
      }, 2000);
    });

    // 卡片交互
    const items = document.querySelectorAll('.card p');
    const toast = document.getElementById('toast');
    items.forEach((item) => {
      item.addEventListener('click', function(e) {
        const label = this.getAttribute('data-label') || this.innerText.trim();
        toast.textContent = `你点击了: ${label}`;
        toast.classList.add('show');
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      });
    });
  </script>

</body>
</html>
