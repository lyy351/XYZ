<!DOCTYPE html>

    <style>
        /* 深色模式基础 */
        .dark {
            background-color: #0c1222;
            color: #e3e3e3;
        }
        .dark .bg-white { background-color: #1a1b26 !important; }
        .dark .bg-gray-50 { background-color: #111827 !important; }
        .dark .bg-gray-100 { background-color: #1f2937 !important; }
        .dark .border-gray-200 { border-color: #2d3748 !important; }
        .dark .text-gray-600 { color: #9ca3af !important; }
        .dark .text-gray-700 { color: #d1d5db !important; }
        .dark .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -2px rgba(0,0,0,0.3) !important; }
        
        html { scroll-behavior: smooth; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.02); }
        .navbar-fixed { backdrop-filter: blur(8px); background-color: rgba(255,255,255,0.9); }
        .dark .navbar-fixed { background-color: rgba(17,24,39,0.9); }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        /* 移动端菜单初始隐藏 */
        .mobile-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .mobile-menu.open {
            max-height: 300px;
        }
    </style>
</head>

                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>

            <!-- 移动端菜单内容 -->

                    <div class="relative z-10 group">
                        <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-full bg-gradient-to-br from-cyan-500 to-blue-500 flex items-center justify-center text-4xl sm:text-5xl shadow-2xl">📖</div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
                <a href="ongoing-series.html" class="group relative block h-full no-underline hover:no-underline">
                    <div class="relative h-full transition-all duration-500 hover:-translate-y-2 hover:shadow-xl rounded-xl">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl blur opacity-0 group-hover:opacity-40 transition duration-500"></div>

        <p class="mt-1 text-xs">📧 联系作者：<a href="mailto:your@email.com" class="hover:text-blue-600">your@email.com</a></p>
    </footer>

    <script>
        // 深色模式切换逻辑
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        const isDark = localStorage.getItem('theme') === 'dark' || (window.matchMedia('(prefers-color-scheme: dark)').matches && !localStorage.getItem('theme'));
        if (isDark) { htmlElement.classList.add('dark'); themeIcon.innerText = '☀️'; } else { htmlElement.classList.remove('dark'); themeIcon.innerText = '🌙'; }
        themeToggle.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) { htmlElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); themeIcon.innerText = '🌙'; } 
            else { htmlElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); themeIcon.innerText = '☀️'; }
        });

        // 移动端菜单展开/收起
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('open');
        });
    </script>
</body>
</html>
