<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>已完结 · 作品列表 | XYZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 完全相同的样式（略，与连载页一致，只修改头部图标和部分文字） */
        .dark { background-color: #0c1222; color: #e3e3e3; }
        .dark .bg-white { background-color: #1a1b26 !important; }
        .dark .bg-gray-50 { background-color: #111827 !important; }
        .dark .border-gray-200 { border-color: #2d3748 !important; }
        .dark .text-gray-600 { color: #9ca3af !important; }
        .dark .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -2px rgba(0,0,0,0.3) !important; }
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .mobile-menu.open { max-height: 300px; }
        .stamp-card {
            background-color: white;
            border-radius: 0;
            transition: all 0.3s ease;
            position: relative;
            margin: 12px;
        }
        .dark .stamp-card { background-color: #1a1b26; }
        .stamp-card::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 16px;
            right: 16px;
            height: 16px;
            background: repeating-linear-gradient(90deg, transparent, transparent 12px, #fff 12px, #fff 24px);
            background-repeat: repeat-x;
            z-index: 2;
        }
        .dark .stamp-card::before {
            background: repeating-linear-gradient(90deg, transparent, transparent 12px, #1a1b26 12px, #1a1b26 24px);
        }
        .stamp-card::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 16px;
            right: 16px;
            height: 16px;
            background: repeating-linear-gradient(90deg, transparent, transparent 12px, #fff 12px, #fff 24px);
            background-repeat: repeat-x;
            z-index: 2;
        }
        .dark .stamp-card::after {
            background: repeating-linear-gradient(90deg, transparent, transparent 12px, #1a1b26 12px, #1a1b26 24px);
        }
        .stamp-card .left-perf {
            position: absolute;
            top: 16px;
            bottom: 16px;
            left: -8px;
            width: 16px;
            background: repeating-linear-gradient(0deg, transparent, transparent 12px, #fff 12px, #fff 24px);
            background-repeat: repeat-y;
            z-index: 2;
        }
        .dark .stamp-card .left-perf {
            background: repeating-linear-gradient(0deg, transparent, transparent 12px, #1a1b26 12px, #1a1b26 24px);
        }
        .stamp-card .right-perf {
            position: absolute;
            top: 16px;
            bottom: 16px;
            right: -8px;
            width: 16px;
            background: repeating-linear-gradient(0deg, transparent, transparent 12px, #fff 12px, #fff 24px);
            background-repeat: repeat-y;
            z-index: 2;
        }
        .dark .stamp-card .right-perf {
            background: repeating-linear-gradient(0deg, transparent, transparent 12px, #1a1b26 12px, #1a1b26 24px);
        }
        .book-cover {
            width: 112px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .dark .book-cover {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="bg-[#f8f9fa] dark:bg-[#0c1222] font-sans antialiased transition-colors duration-300">

    <!-- 顶部导航栏（完结作品高亮） -->
    <nav class="sticky top-0 z-50 w-full backdrop-blur-md bg-white/80 dark:bg-gray-900/80 border-b border-gray-200 dark:border-gray-800 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3"><a href="index.html" class="flex items-center space-x-2"><span class="text-2xl">📖</span><span class="font-bold text-xl text-gray-900 dark:text-white">XYZ</span></a></div>
                <div class="hidden md:flex items-center space-x-6">
                    <a href="index.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 font-medium">首页</a>
                    <a href="ongoing-series.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 font-medium">连载作品</a>
                    <a href="completed-series.html" class="text-blue-600 dark:text-blue-400 font-medium border-b-2 border-blue-500 pb-1">完结作品</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="https://github.com/lyy351" target="_blank" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" /></svg></a>
                    <a href="#" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg></a>
                    <button id="themeToggle" class="p-2 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-yellow-300"><span id="themeIcon" class="text-lg">🌙</span></button>
                    <button id="menuBtn" class="md:hidden p-2 rounded-md text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                </div>
            </div>
            <div id="mobileMenu" class="mobile-menu md:hidden bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800">
                <div class="flex flex-col space-y-3 py-4 px-2">
                    <a href="index.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 font-medium pl-3">首页</a>
                    <a href="ongoing-series.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 font-medium pl-3">连载作品</a>
                    <a href="completed-series.html" class="text-blue-600 dark:text-blue-400 font-medium border-l-2 border-blue-500 pl-3">完结作品</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 头部区域 -->
    <div class="relative border-b border-gray-200 dark:border-gray-800 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-slate-50 via-white to-white dark:from-[#111827] dark:via-[#0f172a] dark:to-[#0f172a]"></div>
        <div class="max-w-6xl mx-auto px-4 sm:px-6 relative z-10">
            <div class="relative pt-6 md:pt-10 md:pb-12 pb-8">
                <div class="relative z-10">
                    <h1 class="text-2xl sm:text-3xl md:text-5xl font-extrabold text-gray-900 dark:text-white tracking-tight leading-tight mb-4 max-w-4xl">🏆 完结作品</h1>
                    <p class="text-sm sm:text-base md:text-lg text-gray-600 dark:text-gray-300 leading-relaxed max-w-3xl mb-1">完整的故事，可以一口气读完。</p>
                    <div class="mt-4 flex flex-wrap items-center gap-2">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-white/90 text-gray-700 dark:bg-gray-800/90 dark:text-gray-300 ring-1 ring-gray-200 dark:ring-gray-700 shadow-sm"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg> <span id="totalCount">0</span> 部作品</span>
                    </div>
                </div>
                <div class="absolute bottom-2 right-2 sm:right-4 md:right-6 pointer-events-none select-none opacity-20 dark:opacity-15"><span class="text-5xl sm:text-7xl md:text-8xl">🏆</span></div>
            </div>
        </div>
    </div>

    <!-- 标签切换 -->
    <div class="max-w-6xl mx-auto px-4 pt-6 md:pt-10 flex justify-center">
        <div class="inline-flex bg-gray-200/50 dark:bg-gray-800/50 rounded-full p-1 shadow-inner">
            <button id="tab-original" class="tab-btn px-4 md:px-8 py-2 rounded-full text-sm md:text-base font-bold transition-all duration-300 bg-white dark:bg-gray-700 text-blue-600 dark:text-blue-400 shadow-[0_2px_10px_rgba(0,0,0,0.1)] dark:shadow-[0_2px_10px_rgba(0,0,0,0.3)]">原创小说</button>
            <button id="tab-doujin" class="tab-btn px-4 md:px-8 py-2 rounded-full text-sm md:text-base font-bold transition-all duration-300 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-800">同人小说</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-6 md:py-8">
        <div id="original-list" class="space-y-6 md:space-y-8"></div>
        <div id="doujin-list" class="space-y-6 md:space-y-8 hidden"></div>
    </div>

    <footer class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 py-6 md:py-8 text-center text-sm text-gray-500 mt-8 md:mt-12">
        <p>© 2025 XYZ · 故事储藏室</p>
        <p class="mt-1 text-xs">📧 联系作者：<a href="mailto:your@email.com" class="hover:text-blue-600">your@email.com</a></p>
    </footer>

    <script>
        // 深色模式
        const themeToggle = document.getElementById('themeToggle'), html = document.documentElement, icon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) { html.classList.add('dark'); icon.innerText = '☀️'; } else { icon.innerText = '🌙'; }
        themeToggle.addEventListener('click', () => { if (html.classList.contains('dark')) { html.classList.remove('dark'); localStorage.setItem('theme', 'light'); icon.innerText = '🌙'; } else { html.classList.add('dark'); localStorage.setItem('theme', 'dark'); icon.innerText = '☀️'; } });

        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => { mobileMenu.classList.toggle('open'); });

        // 完结作品数据
        const novels = {
            original: [
                { title: "《星辰大海》", desc: "一部跨越星际的史诗冒险。少年从废墟中崛起，带着人类的希望冲向星辰大海。", status: "released", links: [{ type: "doc", title: "阅读全文", link: "#" }, { type: "doc", title: "番外篇", link: "#" }] },
                { title: "《梦醒时分》", desc: "都市情感小说，讲述三个年轻人寻找自我与爱情的故事。", status: "released", links: [{ type: "doc", title: "阅读全文", link: "#" }] }
            ],
            doujin: [
                { title: "《平行宇宙》", desc: "基于某科幻世界观创作的同人作品，探索平行宇宙的另一面。", status: "released", links: [{ type: "doc", title: "阅读全文", link: "#" }, { type: "video", title: "设定集", link: "#" }] }
            ]
        };

        function renderCard(item) {
            const isLocked = item.status !== "released";
            const coverArea = `
                <div class="book-cover w-28 h-auto py-4 flex flex-col items-center justify-center gap-2">
                    <div class="text-5xl">🏆</div>
                    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-black ${isLocked ? 'bg-gray-400 text-white ring-4 ring-gray-400/20' : 'bg-emerald-500 text-white ring-4 ring-emerald-400/30 shadow-sm'}">
                        ${isLocked ? '待更新' : '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg> 已完结'}
                    </div>
                </div>
            `;
            const rightArea = `
                <div class="flex-1 p-4">
                    <div class="flex flex-col sm:flex-row items-start justify-between gap-2">
                        <h2 class="text-lg md:text-xl font-black tracking-tight text-gray-900 dark:text-white">${item.title}</h2>
                        <div class="relative inline-flex items-center justify-center select-none px-2 py-0.5 text-xs font-black tracking-widest bg-gray-100 dark:bg-gray-700 rounded-sm" style="color: #c41e1e; transform: rotate(-6deg);">原创</div>
                    </div>
                    <p class="text-xs md:text-sm text-gray-600 dark:text-gray-400 mt-2 leading-relaxed line-clamp-3">${item.desc}</p>
                    <div class="flex flex-wrap gap-2 mt-3">
                        ${item.links.map(link => `<a href="${link.link}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold no-underline transition-all shadow-sm hover:shadow-md hover:-translate-y-0.5 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 ring-1 ring-blue-200 dark:ring-blue-800"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> ${link.title}</a>`).join('')}
                    </div>
                </div>
            `;
            return `
                <div class="relative stamp-card group ${isLocked ? 'opacity-60 grayscale' : ''} hover:shadow-xl transition-all duration-300">
                    <div class="left-perf"></div>
                    <div class="right-perf"></div>
                    <div class="flex flex-row bg-white dark:bg-[#1a1b26] overflow-hidden">
                        ${coverArea}
                        ${rightArea}
                    </div>
                </div>
            `;
        }

        function renderList(type) {
            const container = document.getElementById(`${type}-list`);
            const data = novels[type];
            if (container && data) {
                container.innerHTML = data.map(item => renderCard(item)).join('');
            }
            const total = novels.original.length + novels.doujin.length;
            document.getElementById('totalCount') && (document.getElementById('totalCount').innerText = total);
        }

        const tabOriginal = document.getElementById('tab-original');
        const tabDoujin = document.getElementById('tab-doujin');
        const originalList = document.getElementById('original-list');
        const doujinList = document.getElementById('doujin-list');

        function setActiveTab(active) {
            if (active === 'original') {
                tabOriginal.classList.add('bg-white', 'dark:bg-gray-700', 'text-blue-600', 'dark:text-blue-400', 'shadow-[0_2px_10px_rgba(0,0,0,0.1)]', 'dark:shadow-[0_2px_10px_rgba(0,0,0,0.3)]');
                tabOriginal.classList.remove('text-gray-600', 'dark:text-gray-400', 'hover:bg-gray-200', 'dark:hover:bg-gray-800');
                tabDoujin.classList.remove('bg-white', 'dark:bg-gray-700', 'text-blue-600', 'dark:text-blue-400', 'shadow-[0_2px_10px_rgba(0,0,0,0.1)]', 'dark:shadow-[0_2px_10px_rgba(0,0,0,0.3)]');
                tabDoujin.classList.add('text-gray-600', 'dark:text-gray-400', 'hover:bg-gray-200', 'dark:hover:bg-gray-800');
                originalList.classList.remove('hidden');
                doujinList.classList.add('hidden');
            } else {
                tabDoujin.classList.add('bg-white', 'dark:bg-gray-700', 'text-blue-600', 'dark:text-blue-400', 'shadow-[0_2px_10px_rgba(0,0,0,0.1)]', 'dark:shadow-[0_2px_10px_rgba(0,0,0,0.3)]');
                tabDoujin.classList.remove('text-gray-600', 'dark:text-gray-400', 'hover:bg-gray-200', 'dark:hover:bg-gray-800');
                tabOriginal.classList.remove('bg-white', 'dark:bg-gray-700', 'text-blue-600', 'dark:text-blue-400', 'shadow-[0_2px_10px_rgba(0,0,0,0.1)]', 'dark:shadow-[0_2px_10px_rgba(0,0,0,0.3)]');
                tabOriginal.classList.add('text-gray-600', 'dark:text-gray-400', 'hover:bg-gray-200', 'dark:hover:bg-gray-800');
                doujinList.classList.remove('hidden');
                originalList.classList.add('hidden');
            }
        }

        tabOriginal.addEventListener('click', () => setActiveTab('original'));
        tabDoujin.addEventListener('click', () => setActiveTab('doujin'));

        renderList('original');
        renderList('doujin');
    </script>
</body>
</html>
